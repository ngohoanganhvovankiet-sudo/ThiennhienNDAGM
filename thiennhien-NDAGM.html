<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gỡ Bom Tri Thức - Khí Hậu VN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap');

        :root {
            --bg-color: #050a0f;
            --bomb-bg: #1a1a24;
            --lcd-bg: #051400;
            --lcd-text: #33ff00;
            --danger: #ff003c;
            --wire-1: #ff2a2a;
            --wire-2: #00d8ff;
            --wire-3: #ffcc00;
            --wire-4: #b84dff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050a0f;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            perspective: 800px; /* Tạo chiều sâu 3D cho lưới nền */
        }

        /* Nền vũ trụ ảo công nghệ cao */
        .bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a1520 0%, #000 100%);
            z-index: -3;
            overflow: hidden;
        }

        /* Lưới 3D Synthwave chạy liên tục */
        .cyber-grid {
            position: absolute;
            bottom: -20%; left: -50%; width: 200%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 216, 255, 0.25) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 216, 255, 0.25) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(75deg) translateY(0);
            transform-origin: center top;
            animation: synthwaveGrid 2s linear infinite;
            box-shadow: inset 0px 100px 150px #000; /* Làm mờ đường chân trời */
        }

        @keyframes synthwaveGrid {
            0% { transform: rotateX(75deg) translateY(0); }
            100% { transform: rotateX(75deg) translateY(50px); }
        }

        /* Radar cảnh báo nguy hiểm (Màu đỏ) */
        .radar-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: max(150vw, 150vh); height: max(150vw, 150vh);
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent 70%, rgba(255, 0, 60, 0.05) 80%, rgba(255, 0, 60, 0.4) 100%);
            border-radius: 50%;
            animation: radarSpin 4s linear infinite;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes radarSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Hiệu ứng sọc màn hình CRT cổ điển */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 5;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        #game-screen, #result-screen { display: none; }

        .panel {
            background: rgba(15, 20, 25, 0.95);
            border: 2px solid #334;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 216, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 55px;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 0, 60, 0.8);
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #555;
            color: var(--lcd-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            text-align: center;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { 
            border-color: var(--lcd-text); 
            box-shadow: 0 0 10px rgba(51, 255, 0, 0.3);
        }

        .btn {
            background: #222;
            border: 2px solid #555;
            color: #fff;
            padding: 15px;
            font-size: 26px;
            font-family: 'Teko', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.1s;
            touch-action: manipulation;
            letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.96); background: #444; }
        
        .btn.btn-danger { 
            background: linear-gradient(180deg, #600, #300);
            border-color: var(--danger); 
            color: #ffb3b3; 
            text-shadow: 0 0 5px var(--danger);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }
        .btn.btn-danger:active { background: #400; }
        .btn:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        .bomb-container {
            background: var(--bomb-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(0, 216, 255, 0.15);
            border: 4px solid #333;
            border-top-color: #555;
            position: relative;
        }

        .header-hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
            color: #aaa;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 50px;
            color: var(--danger);
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--danger);
            background: #050000;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #4a0000;
            letter-spacing: 4px;
        }
        .timer-flash { color: #fff; text-shadow: 0 0 25px #fff, 0 0 10px var(--danger); }

        .lcd-screen {
            background: var(--lcd-bg);
            border: 4px solid #000;
            border-radius: 8px;
            padding: 20px 15px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            margin-bottom: 30px;
            position: relative;
        }
        .lcd-screen::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
        }

        .question-text {
            color: var(--lcd-text);
            font-size: 18px;
            text-align: center;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(51, 255, 0, 0.6);
            z-index: 2;
        }

        .wires-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 5px;
        }

        .wire-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            cursor: pointer;
            touch-action: manipulation; 
        }

        .wire-bg {
            position: absolute;
            top: 50%; left: -25px; right: -25px;
            height: 22px;
            transform: translateY(-50%);
            border-radius: 11px;
            box-shadow: inset 0 6px 6px rgba(255,255,255,0.25), inset 0 -6px 6px rgba(0,0,0,0.6), 0 5px 10px rgba(0,0,0,0.5);
            transition: opacity 0.2s;
        }
        .wire-1 .wire-bg { background: var(--wire-1); }
        .wire-2 .wire-bg { background: var(--wire-2); }
        .wire-3 .wire-bg { background: var(--wire-3); }
        .wire-4 .wire-bg { background: var(--wire-4); }

        .wire-cut .wire-bg { opacity: 0; }
        .wire-cut::before, .wire-cut::after {
            content: ''; position: absolute; top: 50%; height: 22px; border-radius: 11px;
            transform: translateY(-50%);
            box-shadow: inset 0 6px 6px rgba(255,255,255,0.25), inset 0 -6px 6px rgba(0,0,0,0.6);
        }
        .wire-cut::before { left: -25px; width: 25%; border-top-right-radius: 0; border-bottom-right-radius: 0; transform: translateY(-20%) rotate(-8deg); }
        .wire-cut::after { right: -25px; width: 25%; border-top-left-radius: 0; border-bottom-left-radius: 0; transform: translateY(-80%) rotate(8deg); }
        
        .wire-1.wire-cut::before, .wire-1.wire-cut::after { background: var(--wire-1); }
        .wire-2.wire-cut::before, .wire-2.wire-cut::after { background: var(--wire-2); }
        .wire-3.wire-cut::before, .wire-3.wire-cut::after { background: var(--wire-3); }
        .wire-4.wire-cut::before, .wire-4.wire-cut::after { background: var(--wire-4); }

        .wire-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111; padding: 10px 15px; border-radius: 6px; border: 2px solid #555;
            color: #eee; font-size: 15px; width: 85%; text-align: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6); pointer-events: none; transition: all 0.2s; z-index: 2;
            font-family: 'Roboto', sans-serif; font-weight: bold; line-height: 1.3;
        }
        .wire-wrapper:active .wire-label { transform: translate(-50%, -50%) scale(0.95); background: #222;}
        .wire-cut .wire-label { transform: translate(-50%, -5px) scale(0.85) rotate(3deg); opacity: 0.4; filter: grayscale(100%); }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(10px, 0, 0) rotate(2deg); }
        }

        .flash-red { animation: flashRed 0.6s ease-out; }
        @keyframes flashRed { 
            0% { background-color: rgba(255, 0, 0, 0.8); } 
            100% { background-color: transparent; } 
        }
        
        .flash-green { animation: flashGreen 0.5s ease-out; }
        @keyframes flashGreen { 
            0% { box-shadow: inset 0 0 60px rgba(51, 255, 0, 0.9); } 
            100% { box-shadow: inset 0 0 20px rgba(0,0,0,0.9); } 
        }

        .result-code {
            background: #000; padding: 12px; border: 2px dashed var(--lcd-text); color: var(--lcd-text);
            font-size: 22px; margin: 20px 0; letter-spacing: 3px; font-weight: bold;
        }
        .result-code.fail {
            border-color: var(--danger);
            color: var(--danger);
        }

        #overlayFX { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 100; }
        #errorMsg { color: var(--danger); font-family: 'Roboto', sans-serif; font-size: 14px; margin-top: 10px; min-height: 20px;}
        
        /* Particle Canvas for Victory */
        #particleCanvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 90; }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="cyber-grid"></div>
        <div class="radar-bg"></div>
    </div>
    <div class="scanlines"></div>
    <div id="overlayFX"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="screen" id="login-screen">
        <div class="panel">
            <h1>GỠ BOM KHÍ HẬU</h1>
            <p style="color: #bbb; margin-bottom: 25px; line-height:1.5; font-family: 'Roboto', sans-serif;">
                Hệ thống sinh thái đang bị đe dọa!<br>
                Bạn có <b>15 giây</b> mỗi câu để cắt đúng dây cáp. Cắt sai hoặc hết giờ, bom sẽ nổ!
            </p>
            <input type="text" id="playerName" placeholder="Tên Chuyên Gia" autocomplete="off">
            <input type="text" id="playerClass" placeholder="Lớp (Ví dụ: 12A1)" autocomplete="off">
            <button class="btn btn-danger" id="btnStart">KÍCH HOẠT HỆ THỐNG</button>
            <div id="errorMsg"></div>
        </div>
    </div>

    <div class="screen" id="game-screen">
        <div class="bomb-container" id="bombBox">
            <div class="header-hud">
                <span id="scoreDisplay">LÕI: 0/10</span>
                <span id="statusDisplay" style="color: var(--danger);">STATUS: ARMED</span>
            </div>
            
            <div class="timer-display" id="timeDisplay">15.00</div>
            
            <div class="lcd-screen" id="lcdScreen">
                <div class="question-text" id="questionText">Đang khởi động dữ liệu...</div>
            </div>

            <div class="wires-container" id="wiresContainer"></div>
        </div>
    </div>

    <div class="screen" id="result-screen">
        <div class="panel">
            <h1 id="resultTitle">BÁO CÁO CHIẾN DỊCH</h1>
            <p id="resultMsg" style="line-height: 1.6; font-size:18px; font-family: 'Roboto', sans-serif;"></p>
            <div class="result-code" id="k12Code"></div>
            <p style="color: #888; font-size: 14px; margin-bottom: 25px; font-family: 'Roboto', sans-serif;">(Chụp lại màn hình này nộp trên K12 Online để nhận điểm thưởng)</p>
            <button class="btn" id="btnRestart">KẾT THÚC CHIẾN DỊCH</button>
        </div>
    </div>

    <script>
        const QUESTION_POOL = [
            // Khí hậu
            { q: "Nhiệt độ trung bình năm trên toàn quốc (trừ vùng núi cao) là bao nhiêu?", a: "Trên 20°C", options: ["Trên 20°C", "Dưới 15°C", "Từ 15°C - 18°C", "Trên 25°C"] },
            { q: "Tổng lượng mưa năm ở nước ta trung bình khoảng bao nhiêu?", a: "1 500 - 2 000 mm", options: ["1 500 - 2 000 mm", "500 - 1 000 mm", "2 500 - 3 500 mm", "Dưới 1 000 mm"] },
            { q: "Độ ẩm tương đối của không khí trung bình năm ở nước ta đạt mức nào?", a: "80 - 85%", options: ["80 - 85%", "50 - 60%", "95 - 100%", "65 - 75%"] },
            { q: "Sự luân phiên của các khối khí hoạt động theo mùa đã tạo nên đặc điểm gì cho khí hậu nước ta?", a: "Sự phân mùa khí hậu", options: ["Sự phân mùa khí hậu", "Mưa quanh năm", "Khô hạn quanh năm", "Băng giá quanh năm"] },
            
            // Gió mùa & Tín phong
            { q: "Gió mùa mùa đông (Đông Bắc) hoạt động chủ yếu vào thời gian nào?", a: "Tháng 11 đến tháng 4 năm sau", options: ["Tháng 11 đến tháng 4 năm sau", "Tháng 5 đến tháng 10", "Tháng 1 đến tháng 6", "Hoạt động quanh năm"] },
            { q: "Nửa sau mùa đông, gió mùa Đông Bắc di chuyển qua biển gây ra kiểu thời tiết gì ở Bắc Bộ?", a: "Lạnh ẩm, có mưa phùn", options: ["Lạnh ẩm, có mưa phùn", "Lạnh khô, trời quang mây", "Nóng bức, khô hạn", "Ấm áp, có mưa rào"] },
            { q: "Dãy núi nào đâm ngang ra biển, ngăn chặn gần như hoàn toàn gió mùa Đông Bắc xuống phía Nam?", a: "Dãy Bạch Mã", options: ["Dãy Bạch Mã", "Dãy Hoàng Liên Sơn", "Dãy Trường Sơn Bắc", "Dãy Hoành Sơn"] },
            { q: "Gió mùa mùa hạ (Tây Nam) hoạt động chủ yếu vào thời gian nào?", a: "Tháng 5 đến tháng 10", options: ["Tháng 5 đến tháng 10", "Tháng 11 đến tháng 4", "Tháng 9 đến tháng 12", "Tháng 2 đến tháng 7"] },
            { q: "Đầu mùa hạ, khối khí nhiệt đới từ vịnh Ben-gan vượt qua dãy Trường Sơn gây ra hiện tượng gì cho ven biển Trung Bộ?", a: "Khô nóng (Gió phơn Tây Nam)", options: ["Khô nóng (Gió phơn Tây Nam)", "Mưa rất lớn", "Lạnh giá bất thường", "Ngập lụt diện rộng"] },
            { q: "Loại gió nào hoạt động quanh năm ở nước ta nhưng thường bị gió mùa lấn át, gây ra mùa khô sâu sắc ở Nam Bộ?", a: "Gió Tín phong", options: ["Gió Tín phong", "Gió mùa Tây Nam", "Gió phơn", "Gió mùa Đông Bắc"] },
            
            // Các thành phần tự nhiên khác
            { q: "Quá trình phong hóa hóa học diễn ra mạnh ở vùng núi đá vôi tạo ra địa hình đặc trưng gì?", a: "Địa hình các-xtơ (hang động)", options: ["Địa hình các-xtơ (hang động)", "Địa hình cao nguyên", "Địa hình đồng bằng", "Địa hình bán bình nguyên"] },
            { q: "Mạng lưới sông ngòi nước ta có đặc điểm gì nổi bật do khí hậu nhiệt đới ẩm gió mùa?", a: "Dày đặc, nhiều nước, giàu phù sa", options: ["Dày đặc, nhiều nước, giàu phù sa", "Thưa thớt, ít nước", "Không có phù sa", "Đóng băng vào mùa đông"] },
            { q: "Mưa nhiều rửa trôi chất bazo, tích tụ oxit sắt và nhôm tạo ra loại đất nào phổ biến ở vùng đồi núi?", a: "Đất feralit đỏ vàng", options: ["Đất feralit đỏ vàng", "Đất phù sa", "Đất mặn", "Đất xám bạc màu"] },
            { q: "Hệ sinh thái rừng nguyên sinh phổ biến nhất ở nước ta là gì?", a: "Rừng rậm nhiệt đới ẩm lá rộng thường xanh", options: ["Rừng rậm nhiệt đới ẩm lá rộng thường xanh", "Rừng lá kim ôn đới", "Thảo nguyên rụng lá", "Rừng ngập mặn ven biển"] },
            
            // Ảnh hưởng sản xuất, đời sống
            { q: "Thiên nhiên nhiệt đới ẩm gió mùa mang lại thuận lợi lớn nhất cho hoạt động nào?", a: "Phát triển nông nghiệp nhiệt đới, tăng vụ", options: ["Phát triển nông nghiệp nhiệt đới, tăng vụ", "Khai thác khoáng sản dễ dàng", "Trồng cây ôn đới quanh năm", "Cơ giới hóa đồng bộ"] },
            { q: "Khó khăn lớn nhất do tính chất thất thường của thời tiết gây ra là gì?", a: "Hoạt động canh tác và phòng chống thiên tai", options: ["Hoạt động canh tác và phòng chống thiên tai", "Xây dựng các nhà máy thủy điện", "Phát triển công nghiệp khai khoáng", "Giao thông đường sắt Bắc - Nam"] },
            { q: "Độ ẩm cao gây ra khó khăn gì cho các ngành công nghiệp và đời sống?", a: "Bảo dưỡng máy móc, dễ rỉ sét hư hỏng", options: ["Bảo dưỡng máy móc, dễ rỉ sét hư hỏng", "Nhiệt độ thấp làm đóng băng thiết bị", "Thiếu nước làm mát thiết bị", "Bụi mù cản trở vận hành"] }
        ];

        const QUESTIONS_PER_GAME = 10;
        const MAX_PLAYS = 2;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) { console.warn("AudioContext blocked"); }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'tick') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'snip') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'success') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'explode') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 1.2);
                    gain.gain.setValueAtTime(1.0, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                    osc.start(now); osc.stop(now + 1.2);
                }
            } catch(e) {}
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const ui = {
            login: document.getElementById('login-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen'),
            bombBox: document.getElementById('bombBox'),
            lcd: document.getElementById('lcdScreen'),
            question: document.getElementById('questionText'),
            wires: document.getElementById('wiresContainer'),
            time: document.getElementById('timeDisplay'),
            score: document.getElementById('scoreDisplay'),
            status: document.getElementById('statusDisplay'),
            overlay: document.getElementById('overlayFX'),
            nameIn: document.getElementById('playerName'),
            classIn: document.getElementById('playerClass'),
            btnStart: document.getElementById('btnStart'),
            errorMsg: document.getElementById('errorMsg'),
            code: document.getElementById('k12Code')
        };

        let currentQueue = [];
        let qIndex = 0;
        let defusedCount = 0; 
        let timeLeft = 0;
        let timerInterval;
        let isProcessing = false;

        let playCount = parseInt(localStorage.getItem('k12BombPlays') || '0');
        if (playCount >= MAX_PLAYS) {
            ui.btnStart.disabled = true;
            ui.errorMsg.innerText = "⛔ Bạn đã hết lượt tham gia chiến dịch (Tối đa 2 lần).";
        }

        ui.btnStart.addEventListener('click', () => {
            if (playCount >= MAX_PLAYS) return;

            const nameVal = ui.nameIn.value.trim();
            const classVal = ui.classIn.value.trim();
            
            if (!nameVal || !classVal) {
                if(!nameVal) ui.nameIn.style.borderColor = "var(--danger)";
                if(!classVal) ui.classIn.style.borderColor = "var(--danger)";
                ui.errorMsg.innerText = "Vui lòng nhập đầy đủ Họ tên và Lớp!";
                setTimeout(() => {
                    ui.nameIn.style.borderColor = '#555';
                    ui.classIn.style.borderColor = '#555';
                    ui.errorMsg.innerText = "";
                }, 1000);
                return;
            }
            
            playCount++;
            localStorage.setItem('k12BombPlays', playCount);
            
            initAudio();
            ui.login.style.display = 'none';
            ui.game.style.display = 'flex';
            
            currentQueue = shuffle(QUESTION_POOL).slice(0, QUESTIONS_PER_GAME);
            qIndex = 0;
            defusedCount = 0;
            loadBomb();
        });

        function loadBomb() {
            isProcessing = false;
            
            if (qIndex >= currentQueue.length) {
                endGame();
                return;
            }

            ui.score.innerText = `LÕI: ${qIndex + 1}/${currentQueue.length} (Đã gỡ: ${defusedCount})`;
            ui.status.innerText = "STATUS: ARMED";
            ui.status.style.color = "var(--danger)";
            
            const qData = currentQueue[qIndex];
            ui.question.innerText = qData.q;
            
            ui.wires.innerHTML = '';
            const ops = shuffle([...qData.options]);
            const wireColors = shuffle(['wire-1', 'wire-2', 'wire-3', 'wire-4']);

            ops.forEach((opt, idx) => {
                const wDiv = document.createElement('div');
                wDiv.className = `wire-wrapper ${wireColors[idx]}`;
                
                const bg = document.createElement('div');
                bg.className = 'wire-bg';
                
                const label = document.createElement('div');
                label.className = 'wire-label';
                label.innerText = opt;

                wDiv.appendChild(bg);
                wDiv.appendChild(label);
                
                wDiv.addEventListener('click', () => handleCut(wDiv, opt, qData.a));
                ui.wires.appendChild(wDiv);
            });

            timeLeft = 15.00;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 100);
        }

        function tick() {
            if (isProcessing) return;
            timeLeft -= 0.1;
            
            if (timeLeft <= 0) {
                timeLeft = 0;
                updateTimerDisplay();
                triggerExplosion("HẾT GIỜ! LÕI BỊ PHÁ HỦY!");
                return;
            }
            
            updateTimerDisplay();
            if (Math.abs(timeLeft % 1) < 0.1 && timeLeft < 15) playSound('tick');
        }

        function updateTimerDisplay() {
            ui.time.innerText = timeLeft.toFixed(2).padStart(5, '0');
            if (timeLeft <= 5) ui.time.classList.add('timer-flash');
            else ui.time.classList.remove('timer-flash');
        }

        function handleCut(wireElement, selected, correct) {
            if (isProcessing || wireElement.classList.contains('wire-cut')) return;
            
            playSound('snip');
            wireElement.classList.add('wire-cut');

            if (selected === correct) {
                isProcessing = true;
                clearInterval(timerInterval);
                defusedCount++;
                playSound('success');
                
                ui.lcd.classList.add('flash-green');
                ui.question.innerText = "LÕI ĐÃ ĐƯỢC VÔ HIỆU HÓA!";
                ui.question.style.color = "var(--lcd-text)";
                ui.status.innerText = "STATUS: SAFE";
                ui.status.style.color = "var(--lcd-text)";
                
                setTimeout(() => {
                    ui.lcd.classList.remove('flash-green');
                    ui.question.style.color = "var(--lcd-text)";
                    qIndex++;
                    loadBomb();
                }, 1000);

            } else {
                triggerExplosion("CẮT SAI MẠCH! BOM NỔ!");
            }
        }

        function triggerExplosion(reason) {
            isProcessing = true;
            clearInterval(timerInterval);
            playSound('explode');
            
            ui.bombBox.classList.add('shake');
            ui.overlay.classList.add('flash-red');
            ui.time.innerText = "00.00";
            ui.time.classList.remove('timer-flash');
            
            ui.question.innerText = reason;
            ui.question.style.color = "var(--danger)";
            ui.status.innerText = "STATUS: DESTROYED";

            setTimeout(() => {
                ui.overlay.classList.remove('flash-red');
                ui.bombBox.classList.remove('shake');
                ui.question.style.color = "var(--lcd-text)";
                qIndex++;
                loadBomb();
            }, 1500);
        }

        function endGame() {
            ui.game.style.display = 'none';
            ui.result.style.display = 'flex';
            
            const name = ui.nameIn.value;
            const cls = ui.classIn.value;
            const total = currentQueue.length;
            const code = `K12-GEO-${Math.floor(1000 + Math.random()*9000)}`;
            
            ui.code.innerText = `MÃ XÁC NHẬN: ${code}`;
            ui.code.className = "result-code"; 

            if (defusedCount === total) {
                // Victory +0.5 & BigBang
                triggerParticleShow();
                document.getElementById('resultTitle').innerText = "CHIẾN DỊCH HOÀN HẢO";
                document.getElementById('resultTitle').style.color = "var(--lcd-text)";
                document.getElementById('resultMsg').innerHTML = 
                    `Tuyệt vời! Chuyên gia <b>${name}</b> (Lớp ${cls}).<br><br>
                    Toàn bộ ${total} lõi dữ liệu đã được gỡ an toàn. Hệ thống sinh thái được bảo vệ.<br><br>
                    <span style="color: var(--lcd-text); font-size: 26px; font-weight: bold; text-shadow: 0 0 10px var(--lcd-text);">THƯỞNG: +0.5 ĐIỂM</span>`;
            } else {
                // Fail/Flaw +0.25
                document.getElementById('resultTitle').innerText = "CĂN CỨ BỊ TỔN HẠI!";
                document.getElementById('resultTitle').style.color = "var(--danger)";
                ui.code.classList.add('fail');
                document.getElementById('resultMsg').innerHTML = 
                    `Chuyên gia <b>${name}</b> (Lớp ${cls}).<br><br>
                    Một số khu vực sinh thái đã bị phá hủy do nổ bom. Số lõi cứu được: ${defusedCount}/${total}<br><br>
                    <span style="color: #ffcc00; font-size: 26px; font-weight: bold; text-shadow: 0 0 10px #ffcc00;">ĐIỂM GHI NHẬN: +0.25 ĐIỂM</span>`;
            }
        }

        document.getElementById('btnRestart').addEventListener('click', () => {
            location.reload();
        });

        // ---------------- Canvas Particles for Perfect Score ----------------
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        let meteors = [];
        let showParticles = false;

        function resizeCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerParticleShow() {
            showParticles = true;
            playSound('explode'); // Reusing big sound
            
            // Big bang particles
            for(let i=0; i<300; i++) {
                particles.push({
                    x: pCanvas.width/2, y: pCanvas.height/2,
                    vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30,
                    size: Math.random() * 4 + 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 1.0, decay: Math.random() * 0.02 + 0.005
                });
            }
        }

        function renderParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            if(!showParticles) {
                requestAnimationFrame(renderParticles);
                return;
            }

            // Draw Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if(p.life > 0) {
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = p.color;
                    pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); pCtx.fill();
                } else {
                    particles.splice(i, 1);
                }
            }
            pCtx.globalAlpha = 1.0;

            // Draw Meteor Showers
            if (Math.random() < 0.15) {
                meteors.push({
                    x: Math.random() * pCanvas.width * 1.5,
                    y: -50,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 20 + 15
                });
            }

            pCtx.shadowBlur = 10;
            pCtx.shadowColor = '#fff';
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                pCtx.beginPath();
                pCtx.moveTo(m.x, m.y);
                pCtx.lineTo(m.x - m.length, m.y - m.length);
                pCtx.strokeStyle = 'rgba(51, 255, 0, 0.8)'; // Green meteors
                pCtx.lineWidth = 3;
                pCtx.stroke();
                m.x -= m.speed; m.y += m.speed;
                if (m.y > pCanvas.height + 100 || m.x < -100) meteors.splice(i, 1);
            }
            pCtx.shadowBlur = 0;

            requestAnimationFrame(renderParticles);
        }
        renderParticles();

    </script>
</body>
</html>
